; Pool de PHP-FPM exclusivo y aislado para proyectos de los Alumnos
; Ubicación en Ubuntu Server: /etc/php/8.3/fpm/pool.d/students.conf

[students]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-students.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Gestión de procesos optimizada para 30 alumnos en PC de instituto (4GB - 16GB RAM)
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; =========================================================================
; SEGURIDAD Y LÍMITES PARA CÓDIGO DE ALUMNOS
; =========================================================================

; Bloquear ejecución de comandos de sistema desde el código PHP de los alumnos
; (La plataforma EduHost corre en el pool 'www' por separado y sí puede correr Artisan)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,pcntl_exec,posix_kill,posix_mkfifo,posix_setpgid,posix_setsid,posix_setuid,symlink,link,dl

; Mostrar errores en pantalla a los alumnos para que aprendan a depurar sus prácticas
php_flag[display_errors] = on
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-students.log
php_admin_value[error_reporting] = E_ALL

; Límites por script para evitar que un ciclo infinito (while true) de un alumno congele la PC
php_admin_value[max_execution_time] = 30
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 32M

; Evitar acceso a cookies de sesión de otros mediante JS
php_admin_flag[session.cookie_httponly] = on

