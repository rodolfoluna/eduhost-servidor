# Nginx Configuration for EduHost (LMS + Academic Mini-Hosting)
# Location on Ubuntu Server: /etc/nginx/sites-available/eduhost.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Directorio principal de la plataforma EduHost (Laravel 11)
    root /var/www/eduhost/public;
    index index.php index.html;

    # Permitir subida de proyectos .ZIP y dumps .SQL (hasta 64MB)
    client_max_body_size 64M;

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # =========================================================================
    # 1. GESTOR VISUAL DE BASE DE DATOS (ADMINER) -> /db-manager
    # =========================================================================
    location = /db-manager {
        return 301 /db-manager/;
    }

    location ^~ /db-manager/ {
        alias /var/www/adminer/;
        index index.php;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # =========================================================================
    # 2. SITIOS WEB DE LOS ALUMNOS -> /~{matricula}/{proyecto}/
    # Soporta tanto proyectos de PHP Puro como proyectos de Laravel (con /public)
    # y aísla cada alumno en su propia carpeta mediante open_basedir
    # =========================================================================

    # Redirección automática si falta la barra final: /~matricula/proyecto -> /~matricula/proyecto/
    location ~ ^/~([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+)$ {
        return 301 /~$1/$2/;
    }

    # Ejecución de archivos PHP dentro de un proyecto de alumno CON carpeta /public (Laravel)
    location ~ ^/~([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+)/public/(.*\.php)$ {
        set $student $1;
        set $project $2;
        set $phpfile $3;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/students/$student/$project/public/$phpfile;
        fastcgi_param DOCUMENT_ROOT /var/www/students/$student/$project/public;
        fastcgi_param SCRIPT_NAME /~$student/$project/$phpfile;

        # Enjaulado estricto (open_basedir): El alumno SOLO puede leer/escribir en su carpeta
        fastcgi_param PHP_ADMIN_VALUE "open_basedir=/var/www/students/$student/:/tmp/:/usr/share/php/";
        fastcgi_pass unix:/run/php/php8.3-fpm-students.sock;
    }

    # Ejecución de archivos PHP dentro de un proyecto de alumno (Detecta si es Laravel o PHP Puro)
    location ~ ^/~([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+)/(.*\.php)$ {
        set $student $1;
        set $project $2;
        set $phpfile $3;

        # Si el proyecto tiene public/index.php (es Laravel) y no viene ya redirigido, enrutar a public/
        set $docroot /var/www/students/$student/$project;
        set $script_path /var/www/students/$student/$project/$phpfile;

        if (-f /var/www/students/$student/$project/artisan) {
            set $docroot /var/www/students/$student/$project/public;
            set $script_path /var/www/students/$student/$project/public/index.php;
        }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $script_path;
        fastcgi_param DOCUMENT_ROOT $docroot;
        # Para que Laravel reconozca correctamente la subruta /~alumno/proyecto
        fastcgi_param SCRIPT_NAME /~$student/$project/index.php;

        # Enjaulado estricto por alumno
        fastcgi_param PHP_ADMIN_VALUE "open_basedir=/var/www/students/$student/:/tmp/:/usr/share/php/";
        fastcgi_pass unix:/run/php/php8.3-fpm-students.sock;
    }

    # Archivos estáticos y rutas amigables de los proyectos de alumnos
    location ~ ^/~([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+)/(.*)$ {
        set $student $1;
        set $project $2;
        set $filepath $3;

        # Buscar primero en public/ (para assets de Laravel), luego en raíz (para PHP puro),
        # y si es una ruta de controlador Laravel, enviarla a index.php
        root /var/www/students;
        try_files /$student/$project/public/$filepath
                  /$student/$project/$filepath
                  /$student/$project/index.php?$query_string
                  /~$student/$project/index.php?$query_string;
    }

    # =========================================================================
    # 3. PLATAFORMA PRINCIPAL EDUHOST (LARAVEL 11) -> /
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

